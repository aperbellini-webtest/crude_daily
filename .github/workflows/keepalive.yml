name: Keepalive
on:
  schedule:
    - cron: '0 0 1 * *' # Esegue il primo giorno di ogni mese
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: mantieni attivo il workflow schedulato"
          git push